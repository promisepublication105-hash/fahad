<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Chat Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f6; --panel: #ffffff; --ink: #1c2530; --muted: #66727f;
    --brand: #0f5c4d; --brand-ink: #ffffff; --bot: #f1f4f7; --line: #dde3ea;
    --chip: #e4efec; --chip-ink: #0f5c4d; --warn-bg: #fff6df; --warn-ink: #7a5600;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1418; --panel: #182026; --ink: #e6ebef; --muted: #93a0ab;
      --brand: #3fae93; --brand-ink: #08201a; --bot: #222c33; --line: #2c3740;
      --chip: #1f3530; --chip-ink: #8fdcc6; --warn-bg: #3a2f12; --warn-ink: #f2d38a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1418; --panel: #182026; --ink: #e6ebef; --muted: #93a0ab;
    --brand: #3fae93; --brand-ink: #08201a; --bot: #222c33; --line: #2c3740;
    --chip: #1f3530; --chip-ink: #8fdcc6; --warn-bg: #3a2f12; --warn-ink: #f2d38a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.6 "Hind Siliguri", system-ui, sans-serif; }
  .app { max-width: 720px; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column;
         background: var(--panel); border-inline: 1px solid var(--line); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px;
           background: var(--brand); color: var(--brand-ink); }
  .logo { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
          background: rgba(255,255,255,.18); font-size: 20px; flex: none; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 0; font-size: 13px; opacity: .85; }
  .badge { margin-left: auto; font-size: 12px; padding: 2px 10px; border-radius: 99px;
           background: rgba(255,255,255,.2); white-space: nowrap; }
  .notice { margin: 0; padding: 8px 16px; font-size: 13px; background: var(--warn-bg); color: var(--warn-ink); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .user { align-self: flex-end; background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; }
  .src { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .src a { color: inherit; }
  .typing { color: var(--muted); font-style: italic; }
  .chips { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; border-top: 1px solid var(--line); }
  .chips button { flex: none; border: 0; border-radius: 99px; padding: 6px 12px; cursor: pointer;
                  background: var(--chip); color: var(--chip-ink); font: inherit; font-size: 14px; }
  form { display: flex; gap: 8px; padding: 12px 16px 16px; }
  input { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 99px; border: 1px solid var(--line);
          background: var(--panel); color: var(--ink); font: inherit; }
  input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  form button { border: 0; border-radius: 99px; padding: 0 18px; background: var(--brand);
                color: var(--brand-ink); font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">🎓</div>
    <div>
      <h1 id="title">College Assistant</h1>
      <p>কলেজ সহকারী চ্যাটবট</p>
    </div>
    <span class="badge">ডেমো</span>
  </header>
  <p class="notice" id="notice" hidden></p>
  <div id="log" role="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form" autocomplete="off">
    <input id="q" placeholder="আপনার প্রশ্ন লিখুন… (বাংলা বা English)" aria-label="প্রশ্ন">
    <button type="submit">পাঠান</button>
  </form>
</div>

<script src="knowledge.js"></script>
<script>
(() => {
  const KB = window.COLLEGE_KB || { meta: { demo: true }, topics: [], chunks: [] };
  const $ = (id) => document.getElementById(id);
  const log = $("log");

  $("title").textContent = KB.meta.name || "College Assistant";
  if (KB.meta.demo || !KB.chunks.length) {
    $("notice").hidden = false;
    $("notice").textContent = "⚠️ ডেমো মোড: ওয়েবসাইট থেকে এখনো তথ্য সংগ্রহ করা হয়নি, তাই উত্তরগুলো নমুনা মাত্র। scrape.py চালালে আসল তথ্য যোগ হবে।";
  }

  // --- text helpers -------------------------------------------------------
  const norm = (s) => s.toLowerCase().replace(/[।,.?!:;"'()\[\]{}\-–—/\\|]/g, " ").replace(/\s+/g, " ").trim();
  const tokens = (s) => norm(s).split(" ").filter((t) => t.length > 1);

  // Inverse document frequency over scraped passages, so common words count less.
  const idf = {};
  KB.chunks.forEach((c) => new Set(tokens(c.title + " " + c.text)).forEach((t) => (idf[t] = (idf[t] || 0) + 1)));
  const N = KB.chunks.length || 1;
  const weight = (t) => Math.log(1 + N / (idf[t] || 0.5));

  function scoreChunk(chunk, qTokens) {
    const hay = norm(chunk.title + " " + chunk.text);
    let s = 0;
    // Substring match so Bangla inflections (ভর্তির, ভর্তিতে) still hit "ভর্তি".
    qTokens.forEach((t) => { if (hay.includes(t)) s += weight(t); });
    return s;
  }

  function bestTopic(q) {
    const nq = " " + norm(q) + " ";
    let best = null, bestScore = 0;
    for (const topic of KB.topics) {
      let s = 0;
      for (const k of topic.keywords) {
        const nk = norm(k);
        if (nk.length <= 3 && /^[a-z]+$/.test(nk) ? nq.includes(" " + nk + " ") : nq.includes(nk)) s += nk.length;
      }
      if (s > bestScore) { best = topic; bestScore = s; }
    }
    return best;
  }

  function searchChunks(qTokens, limit = 2) {
    return KB.chunks
      .map((c) => ({ c, s: scoreChunk(c, qTokens) }))
      .filter((x) => x.s > 0)
      .sort((a, b) => b.s - a.s)
      .slice(0, limit)
      .filter((x, i, arr) => i === 0 || x.s >= 0.6 * arr[0].s);
  }

  function contactLine() {
    const m = KB.meta, parts = [];
    if (m.phones && m.phones.length) parts.push("📞 " + m.phones.join(", "));
    if (m.emails && m.emails.length) parts.push("✉️ " + m.emails.join(", "));
    return parts.join("\n");
  }

  function answer(q) {
    const topic = bestTopic(q);
    if (topic && topic.fixed) return { text: topic.answer };

    // Expand the question with the topic's keywords to help retrieval.
    const qTokens = [...new Set([...tokens(q), ...(topic ? topic.keywords.map(norm) : [])])];
    const hits = searchChunks(qTokens);
    if (hits.length) {
      let text = hits.map((h) => h.c.text).join("\n\n");
      if (text.length > 700) text = text.slice(0, 700) + "…";
      if (topic && topic.id === "contact" && contactLine()) text = contactLine() + "\n\n" + text;
      return { text, src: hits[0].c.url };
    }
    if (topic) return { text: topic.answer + (KB.meta.demo ? "\n\n(ডেমো উত্তর)" : ""), src: KB.meta.source };
    return {
      text: "দুঃখিত, এই প্রশ্নের উত্তর আমার কাছে নেই। 🙏\nনিচের বিষয়গুলো থেকে বেছে নিতে পারেন, অথবা অন্যভাবে প্রশ্ন করুন।",
      src: KB.meta.source,
    };
  }

  // --- UI -----------------------------------------------------------------
  function add(role, text, src) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    if (src) {
      const s = document.createElement("span");
      s.className = "src";
      s.append("সূত্র: ");
      const a = document.createElement("a");
      a.href = src; a.target = "_blank"; a.rel = "noopener"; a.textContent = src.replace(/^https?:\/\//, "");
      s.append(a);
      div.append(s);
    }
    log.append(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function ask(q) {
    q = q.trim();
    if (!q) return;
    add("user", q);
    const typing = add("bot typing", "লিখছি…");
    setTimeout(() => {
      typing.remove();
      const a = answer(q);
      add("bot", a.text, a.src);
    }, 350);
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); ask($("q").value); $("q").value = ""; });

  KB.topics.filter((t) => !t.fixed).forEach((t) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = t.label;
    b.onclick = () => ask(t.label);
    $("chips").append(b);
  });

  add("bot", `আসসালামু আলাইকুম! 👋 আমি ${KB.meta.name || "কলেজ"}-এর সহকারী চ্যাটবট।\nভর্তি, বিভাগ, বেতন, যোগাযোগ বা নোটিশ নিয়ে প্রশ্ন করুন, অথবা নিচের কোনো বিষয়ে চাপ দিন।`);
})();
</script>
</body>
</html>
